<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TravelWell.World — a Travel Operating System. From a feeling to a beautifully booked trip." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..600&family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>TravelWell.World — Designed around you.</title>

    <!-- Social / link-preview cards. The brand name appears here as it appears
         everywhere: ONE word. These are static and site-wide; per-route og tags
         need the prerender pass (a client-rendered page can't vary its head). -->
    <meta property="og:site_name" content="TravelWell.World" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.travelwell.world/" />
    <meta property="og:title" content="TravelWell.World — Designed around you." />
    <meta property="og:description" content="TravelWell.World — a Travel Operating System. From a feeling to a beautifully booked trip." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TravelWell.World — Designed around you." />
    <meta name="twitter:description" content="TravelWell.World — a Travel Operating System. From a feeling to a beautifully booked trip." />

    <!-- The organization record. This is the field an AI answer engine reads when
         it names or attributes us, so it is STATIC here rather than injected by
         JavaScript: a crawler that doesn't run JS still sees the brand spelled
         correctly. Page-level structured data points its `publisher` at this @id. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.travelwell.world/#organization",
        "name": "TravelWell.World",
        "alternateName": "TravelWell",
        "url": "https://www.travelwell.world/",
        "slogan": "If It's Travel… TravelWell.",
        "description": "A Travel Operating System — from a feeling to a beautifully booked trip."
      }
    </script>

    <!-- PWA / add-to-home-screen -->
    <meta name="theme-color" content="#244a3c" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TravelWell" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

# Quality gate — typecheck, build, and the automated accessibility audit.
# Canon (CLAUDE.md): a11y is "checkable, not a vibe" — an a11y regression fails
# the build here, the same discipline as the dossier QC gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ── THE DATA GATES ──────────────────────────────────────────────────
      # Content now arrives by pull request (Sana, 2026-08-17), and until this
      # was added CI never ran a single one of them: typecheck, build, brand and
      # a11y all pass happily on a batch that fails the ingest gate. PR 49 —
      # 484 rows from the research library — carried a green tick while failing
      # `validate:ingest` on 17 rows.
      #
      # That is the exact failure the two-gate argument exists to prevent, with
      # the gates present in the repo and simply not wired to the one place a
      # human reads before merging. A gate nobody runs is a document.
      #
      # These run BEFORE the slow steps: a bad batch should fail in seconds, not
      # after a Chromium install.
      - name: Ingest gate — destinations (self-check + any dropped-in batch)
        run: npm run validate:ingest
      - name: Ingest gate — Special-Interest dossiers
        run: npm run validate:si
      - name: Provider gate
        run: npm run validate:providers
      - name: Advisory text gate — no hazard attributed to a source that doesn't name it
        run: npm run check:advisory-text
      - name: Generated files match their source
        # Catches the other half: a source edit committed without regenerating
        # the seed migration, the sitemap, the fact sheet or the rewrite list.
        run: npm run check:generated

      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Brand mark — one form only
        # Scans the BUILT output, so it covers metadata, og: tags, JSON-LD and
        # every translated string, not just visible copy. David, 2026-08-04:
        # structured data is the machine-readable version of the mark, so it is
        # what an AI cites when it names us.
        run: npm run check:brand
      - name: Install Chromium (for the a11y audit)
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (WCAG 2.1 A/AA)
        env:
          A11Y_BASE: http://localhost:4173
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          npm run a11y
